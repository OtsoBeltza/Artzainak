<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#20241F">
<title>CDEO — Bergerie &amp; Orhy</title>
<style>
  :root{
    --ink:#1B201B; --paper:#F5F4EE; --line:#C9C7BD; --white:#fff;
    --head:#20241F; --straw:#D9A441; --muted:#6B6B60; --alert:#E07B00;
    --J:#D9A441; --Jsoft:#F6ECD6; --Jdark:#8A6A20;
    --V:#1E7A46; --Vsoft:#DFEEE4;
    --R:#BC2B2A; --Rsoft:#F3DEDD;
    --B:#2C5F8A; --Bsoft:#DDE8F1;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink)}
  header{background:var(--head);padding:14px 16px 0}
  header .eyebrow{color:var(--straw);letter-spacing:.18em;font-size:11px;font-weight:700;text-transform:uppercase;margin:0}
  header h1{color:#fff;font-size:20px;font-weight:800;margin:2px 0 8px}
  .headrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .total{color:#fff;font-weight:800;font-size:22px;line-height:1}
  .total small{display:block;color:#A8ACA3;font-weight:400;font-size:11px;margin-top:2px}
  .btn{border:1px solid #565B54;background:transparent;color:#fff;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
  .btn.solid{background:var(--straw);color:var(--ink);border-color:var(--straw);font-weight:700}
  .msg{color:#D8DCD3;font-size:12px;margin:8px 0 0}
  .warn{color:#F2B8B5;font-size:12px;margin:8px 0 0}
  .tabs{display:flex;gap:6px;margin-top:12px}
  .tab{flex:1;border:none;border-radius:8px 8px 0 0;padding:10px 6px;font-size:13px;font-weight:800;cursor:pointer;background:#3A3F39;color:#B9BDB5}
  .tab.on{background:var(--paper);color:var(--ink)}
  .scanbar{display:flex;gap:6px;align-items:center;background:#fff;border:1.5px solid var(--straw);border-radius:8px;margin:12px 8px 0;padding:8px}
  .scanbar input{flex:1;min-width:0;border:none;outline:none;font-size:15px;font-family:ui-monospace,monospace;background:transparent}
  .scanbar .lbl{font-size:11px;font-weight:800;color:var(--Jdark);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .planwrap{overflow-x:auto;padding:14px 8px}
  svg{display:block}
  .legend{display:flex;flex-wrap:wrap;gap:14px;padding:0 16px 10px;font-size:12px;color:var(--muted);align-items:center}
  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:5px}
  .adot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--alert);margin-right:5px}
  .panel{background:#fff;border-radius:10px;margin:0 8px 20px;padding:14px;box-shadow:0 1px 4px #0002}
  .panel h2{font-size:17px;font-weight:800;margin:0}
  .zbadge{display:inline-block;border-radius:5px;padding:2px 8px;color:#fff;font-size:13px;margin-right:8px;vertical-align:middle}
  .sub{font-size:12px;color:var(--muted);margin:3px 0 0}
  .close{float:right;background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;padding:4px}
  .box{border-radius:8px;padding:10px;margin-top:12px}
  .boxtitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin:0 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;padding:0;list-style:none}
  .chip{background:#fff;border:1.5px solid;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;font-family:ui-monospace,monospace;display:flex;align-items:center;gap:7px}
  .chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0}
  .row{display:flex;flex-wrap:wrap;gap:6px}
  input[type=text],input[type=date],select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;background:#fff}
  input[type=text]{flex:1;min-width:0;font-family:ui-monospace,monospace}
  input[type=number]{border:1px solid var(--line);border-radius:6px;padding:5px;width:60px;text-align:center;font-weight:700}
  .act{border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:700;color:#fff;cursor:pointer}
  .hist{list-style:none;margin:10px 0 0;padding:0}
  .hist li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
  .tag{border-radius:5px;padding:2px 7px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .hist .del,.hist .edit{background:none;border:none;font-size:11px;cursor:pointer}
  .hist .del{color:#9A9A8C}
  .hist .edit{color:var(--ink);font-weight:700}
  .hist .when{font-size:11px;color:var(--muted);margin-top:2px}
  .due{display:inline-block;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:800;margin-left:6px}
  .due.soon{background:#FBEACD;color:#8A5300}
  .due.late{background:#F8DBDB;color:#8E1F1F}
  .due.ok{background:#EDECE5;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(10,1fr)}}
  .cellbtn{border:1.5px solid var(--J);border-radius:6px;background:#fff;padding:6px 2px;text-align:center;cursor:pointer}
  .cellbtn.sel{border-color:var(--ink);border-width:2.5px}
  .cellbtn .id{display:block;font-size:11px;font-weight:700;font-family:ui-monospace,monospace}
  .cellbtn .n{display:block;font-size:14px;font-weight:800}
  .hint{padding:0 16px 24px;font-size:13px;color:var(--muted)}
  #searchinput{width:100%;font-family:inherit}
  .sr-group{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:12px 0 6px}
  .sr-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
  .sr-item:active{background:var(--paper)}
  .sr-ram{font-family:ui-monospace,monospace;font-weight:700;font-size:14px}
  .sr-where{font-size:12px;color:var(--muted);flex:1;min-width:0}
  .sr-zone{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .sr-open{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
  .sr-empty{font-size:13px;color:var(--muted);padding:8px 0 0}
  .cfg label{font-size:13px;margin-right:12px;display:inline-block;margin-bottom:8px}
  .mono{font-family:ui-monospace,monospace}
  .dash h3{font-size:14px;font-weight:800;margin:0 0 8px}
  .dash table{border-collapse:collapse;width:100%;font-size:13px}
  .dash td,.dash th{padding:5px 8px;border-top:1px solid var(--line);text-align:left}
  .dash th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .dash td.num{text-align:right;font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="csvfile" accept=".csv,.txt" style="display:none">
<input type="file" id="bakfile" accept=".json" style="display:none">

<script>
"use strict";
// ————————————————————————————————————————————
// CDEO — Bergerie (béliers) & Orhy (agneaux), hors-ligne.
// Sauvegarde/restauration complète, scan global Allflex,
// événements groupés, rappels de soins, synthèse, naissances,
// pesées, modification des événements.
// ————————————————————————————————————————————

var STORAGE_KEY = "bergerie_cdeo_v1";
var state = { config: { west:18, east:17, indiv:20, capCol:0, capInd:0, capOrhy:0 },
              pens: {}, events: {}, moves: [], partitions: {} };
var ui = { building:"bergerie", selected:null, indOpen:false, showConfig:false, showGroupEvent:false,
           ioMessage:"", storageOk:true, formType:"soin", formDate:todayISO(), search:"",
           ramView:null, editingEvId:null };

var ZONES = {
  J: { id:"J", label:"Zone jaune", color:"#D9A441", soft:"#F6ECD6", dark:"#8A6A20" },
  V: { id:"V", label:"Zone verte", color:"#1E7A46", soft:"#DFEEE4", dark:"#1E7A46" },
  R: { id:"R", label:"Zone rouge", color:"#BC2B2A", soft:"#F3DEDD", dark:"#BC2B2A" },
  B: { id:"B", label:"Zone bleue", color:"#2C5F8A", soft:"#DDE8F1", dark:"#2C5F8A" }
};
var SAUT_ZONE = {1:"J",2:"R",3:"V",4:"B"};
var BLOCKS = {
  A: { id:"A", label:"Bloc A", color:"#4A4F49", soft:"#ECEBE4", dark:"#4A4F49" },
  B: { id:"B", label:"Bloc B", color:"#4A4F49", soft:"#ECEBE4", dark:"#4A4F49" },
  C: { id:"C", label:"Bloc C", color:"#4A4F49", soft:"#ECEBE4", dark:"#4A4F49" },
  D: { id:"D", label:"Bloc D", color:"#4A4F49", soft:"#ECEBE4", dark:"#4A4F49" }
};
var EVENT_TYPES = [
  { id:"soin", label:"Soin", color:"#8A4A9E" },
  { id:"collecte", label:"Collecte / récolte", color:"#1E7A46" },
  { id:"saut", label:"Saut / saillie", color:"#B03A6B" },
  { id:"pesee", label:"Pesée", color:"#5B7A2A" },
  { id:"alimentation", label:"Alimentation", color:"#B07A2A" },
  { id:"mouvement", label:"Mouvement", color:"#2C5F8A" },
  { id:"note", label:"Note", color:"#6B6B60" }
];

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return ""; var p=iso.split("-"); return p.length===3? p[2]+"/"+p[1]+"/"+p[0] : iso; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toISO(v){
  v=String(v||"").trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  var m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
  return "";
}
function daysBetween(isoA, isoB){
  return Math.round((new Date(isoB)-new Date(isoA))/86400000);
}
function ageStr(naiss){
  if(!naiss) return "";
  var d=daysBetween(naiss, todayISO());
  if(d<0) return "";
  if(d<60) return d+" j";
  var months=Math.floor(d/30.44);
  if(months<24) return months+" mois";
  var y=Math.floor(months/12);
  return y+" an"+(y>1?"s":"")+(months%12? " "+(months%12)+" mois":"");
}

// ————— identifiants de cases —————
function isSaut(id){ return id.indexOf("SAUT-")===0; }
function isInd(id){ return id.indexOf("IND-")===0; }
function isOrhy(id){ return id.indexOf("O:")===0; }
function bldgOf(id){ return isOrhy(id)? "orhy" : "bergerie"; }
function orhyBlock(id){ return id.split(":")[1].split("-")[0]; }
function orhyNum(id){ return parseInt(id.split("-")[1],10); }
function orhyToken(id){ return orhyBlock(id).toLowerCase()+orhyNum(id); }
function animalWord(b){ return b==="orhy"? "agneau" : "b\u00E9lier"; }
function animalIcon(b){ return b==="orhy"? "&#128017;" : "&#128016;"; }

function zoneOf(id){
  if(isOrhy(id)) return BLOCKS[orhyBlock(id)] || BLOCKS.A;
  var p = id.split("-")[0];
  if (p==="IND") return ZONES.J;
  if (p==="SAUT") return ZONES[SAUT_ZONE[parseInt(id.split("-")[1],10)]] || ZONES.J;
  return ZONES[p] || ZONES.J;
}
function kindOf(id){
  if(isOrhy(id)) return "Case agneaux";
  if (isInd(id)) return "Case individuelle";
  if (isSaut(id)) return "Case de saut";
  return "Case collective";
}

// ————— numérotation bergerie (horaire 1..67) —————
function yellowN(){ return Math.max(0, state.config.west - 3); }
function numbering(){
  var map={}, w=state.config.west, y=yellowN(), e=state.config.east, i;
  for(i=1;i<=w;i++) map["V-"+i]=w-i+1;
  for(i=1;i<=y;i++) map["J-"+i]=w+i;
  for(i=1;i<=e;i++) map["R-"+i]=w+y+i;
  for(i=1;i<=e;i++) map["B-"+i]=w+y+e+(e-i+1);
  return map;
}
function numberToId(){
  var rev={}, map=numbering();
  Object.keys(map).forEach(function(id){ rev[map[id]]=id; });
  return rev;
}
function bergerieIds(){
  var ids=Object.keys(numbering()), i;
  for(i=1;i<=state.config.indiv;i++) ids.push("IND-"+i);
  return ids;
}
function orhyIds(){
  var ids=[], blocks=["A","B","C","D"], i, n;
  for(i=0;i<4;i++) for(n=1;n<=6;n++) ids.push("O:"+blocks[i]+"-"+n);
  return ids;
}
function allIds(){ return bergerieIds().concat(orhyIds()); }
function buildingIds(b){ return b==="orhy"? orhyIds() : bergerieIds(); }
function lastNumber(){ return state.config.west + yellowN() + 2*state.config.east; }

function penTitle(id){
  if(isOrhy(id)) return "Orhy \u00B7 case "+orhyToken(id)+" ("+zoneOf(id).label+")";
  if (isSaut(id)) return "Case de saut "+zoneOf(id).label.replace("Zone ","");
  if (isInd(id)) return "Case individuelle I"+id.split("-")[1];
  return "Case collective n\u00B0 "+(numbering()[id]||"?");
}
function caseToken(id){
  if(isOrhy(id)) return orhyToken(id);
  if (isInd(id)) return "ind_"+id.split("-")[1];
  return String(numbering()[id]);
}
function capacityOf(id){
  if(isOrhy(id)) return state.config.capOrhy||0;
  if(isInd(id)) return state.config.capInd||0;
  return state.config.capCol||0;
}

// ————— cloisons amovibles (Orhy) —————
function partKey(block,row,gap){ return block+"-"+row+"-"+gap; }
function partOpen(block,row,gap){ return !!state.partitions[partKey(block,row,gap)]; }
function groupOf(id){
  if(!isOrhy(id)) return [id];
  var b=orhyBlock(id), n=orhyNum(id);
  // 1-2-3 en rangée basse (1 en bas à gauche), 4-5-6 en rangée haute (4 face au 1)
  var row=(n<=3)? "B" : "T";
  var base=(n<=3)? 0 : 3;
  var col=n-base;
  var start=col, end=col;
  while(start>1 && partOpen(b,row,start-1)) start--;
  while(end<3 && partOpen(b,row,end)) end++;
  var ids=[];
  for(var c=start;c<=end;c++) ids.push("O:"+b+"-"+(base+c));
  return ids;
}
function leaderOf(id){ return groupOf(id)[0]; }
function groupTokenLabel(ids){
  if(ids.length===1) return orhyToken(ids[0]);
  return orhyToken(ids[0])+"\u2013"+orhyToken(ids[ids.length-1]);
}
window.togglePartition=function(key){
  state.partitions[key]=!state.partitions[key];
  if(ui.selected && isOrhy(ui.selected)) ui.selected=leaderOf(ui.selected);
  save(); render();
};

// ————— stockage local + sauvegarde complète —————
function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) applyData(JSON.parse(raw));
  }catch(e){ ui.storageOk=false; }
}
function applyData(d){
  if(!d) return;
  if (d.config) state.config = {
    west:d.config.west||18, east:d.config.east||17, indiv:d.config.indiv||20,
    capCol:d.config.capCol||0, capInd:d.config.capInd||0, capOrhy:d.config.capOrhy||0
  };
  if (d.pens) state.pens = d.pens;
  if (d.events) state.events = d.events;
  if (d.moves) state.moves = d.moves;
  if (d.partitions) state.partitions = d.partitions;
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); ui.storageOk=true; }
  catch(e){ ui.storageOk=false; }
}
window.exportBackup=function(){
  var payload=JSON.stringify({ app:"cdeo-bergerie", version:1, savedAt:new Date().toISOString(), state:state }, null, 1);
  var blob=new Blob([payload],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download="sauvegarde_cdeo_"+todayISO()+".json"; a.click();
  URL.revokeObjectURL(url);
  ui.ioMessage="Sauvegarde compl\u00E8te export\u00E9e (b\u00E2timents, historiques, d\u00E9placements, cloisons)."; render();
};
window.triggerRestore=function(){ document.getElementById("bakfile").click(); };

// ————— données —————
function ramNum(r){ return (typeof r==="string")? r : ((r&&r.num)||""); }
function ramCdo(r){ return (r&&typeof r==="object")? (r.cdo||"") : ""; }
function ramRace(r){ return (r&&typeof r==="object")? (r.race||"") : ""; }
function ramNaiss(r){ return (r&&typeof r==="object")? (r.naissance||"") : ""; }
function findRam(list,num){ for(var i=0;i<list.length;i++){ if(ramNum(list[i])===num) return i; } return -1; }
function ramDesc(r){
  var extra=[]; if(ramCdo(r)) extra.push("CDO "+ramCdo(r)); if(ramRace(r)) extra.push(ramRace(r));
  var a=ageStr(ramNaiss(r)); if(a) extra.push(a);
  return extra.join(" \u00B7 ");
}
function currentCaseOf(num){
  var ids=allIds();
  for(var i=0;i<ids.length;i++){
    var p=state.pens[ids[i]];
    if(p&&p.rams&&findRam(p.rams,num)>-1) return ids[i];
  }
  return null;
}
function getRam(num){
  var c=currentCaseOf(num);
  if(!c) return null;
  var p=state.pens[c];
  return p.rams[findRam(p.rams,num)];
}
function logMove(num, from, to, date){
  state.moves.push({ ram:num, from:from||"", to:to||"", date:date||todayISO() });
}
function moveLabel(mv){
  if(mv.from && mv.to) return "D\u00E9plac\u00E9 de \u00AB "+safeCaseName(mv.from)+" \u00BB vers \u00AB "+safeCaseName(mv.to)+" \u00BB";
  if(mv.to) return "Plac\u00E9 en \u00AB "+safeCaseName(mv.to)+" \u00BB";
  if(mv.from) return "Sorti de \u00AB "+safeCaseName(mv.from)+" \u00BB";
  return "Mouvement";
}
function safeCaseName(id){
  if(!id) return "";
  if(isOrhy(id) || isInd(id) || numbering()[id]!==undefined) return penTitle(id);
  return id;
}
function penCount(id){
  var p=state.pens[id]; if(!p) return 0;
  return (p.rams?p.rams.length:0) + (p.legacy||0);
}
function groupCount(ids){ var s=0; ids.forEach(function(id){ s+=penCount(id); }); return s; }
function totalSheep(b){
  if(b==="synthese") return totalSheep("bergerie")+totalSheep("orhy");
  return buildingIds(b).reduce(function(s,id){return s+penCount(id);},0);
}
function occupiedCount(b){
  if(b==="synthese") return occupiedCount("bergerie")+occupiedCount("orhy");
  return buildingIds(b).filter(function(id){return penCount(id)>0;}).length;
}
function maxCount(){ var m=1; allIds().forEach(function(id){ m=Math.max(m,penCount(id)); }); return m; }
function indTotal(){ var s=0,i; for(i=1;i<=state.config.indiv;i++) s+=penCount("IND-"+i); return s; }

// déplacement centralisé (utilisé par ajout, scan, fiche animal, import)
function moveAnimal(num, targetId, extra){
  var from=currentCaseOf(num);
  if(targetId && from===targetId) return false;
  var keep=null;
  if(from){
    var old=state.pens[from];
    keep=old.rams[findRam(old.rams,num)];
    old.rams=old.rams.filter(function(r){return ramNum(r)!==num;});
  }
  if(targetId){
    var rec={ num:num,
      cdo:(extra&&extra.cdo)||ramCdo(keep)||"",
      race:(extra&&extra.race)||ramRace(keep)||"",
      naissance:(extra&&extra.naissance)||ramNaiss(keep)||"" };
    var pen=state.pens[targetId]||{rams:[]}; if(!pen.rams) pen.rams=[];
    pen.rams.push(rec); state.pens[targetId]=pen;
  }
  logMove(num, from, targetId||null);
  return true;
}

// ————— rappels —————
function dueClass(echeance){
  if(!echeance) return "";
  var d=daysBetween(todayISO(), echeance);
  if(d<0) return "late";
  if(d<=14) return "soon";
  return "ok";
}
function allReminders(){
  var out=[];
  allIds().forEach(function(id){
    (state.events[id]||[]).forEach(function(ev){
      if(ev.echeance) out.push({id:id, ev:ev, cls:dueClass(ev.echeance)});
    });
  });
  out.sort(function(a,b){ return a.ev.echeance>b.ev.echeance?1:-1; });
  return out;
}
function penHasDue(id){
  var evs=state.events[id]||[];
  for(var i=0;i<evs.length;i++){
    var c=dueClass(evs[i].echeance);
    if(c==="late"||c==="soon") return true;
  }
  return false;
}
function groupHasDue(ids){ for(var i=0;i<ids.length;i++){ if(penHasDue(ids[i])) return true; } return false; }

// ————— navigation —————
window.setBuilding=function(b){
  if(ui.building===b) return;
  ui.building=b; ui.selected=null; ui.ramView=null; ui.indOpen=false; ui.showConfig=false;
  ui.showGroupEvent=false; ui.editingEvId=null;
  render();
};
window.selectPen=function(id){
  var target = isOrhy(id)? leaderOf(id) : id;
  ui.selected = (ui.selected===target)? null : target;
  ui.ramView=null; ui.editingEvId=null;
  if(ui.selected) ui.building = bldgOf(ui.selected);
  render();
  if (ui.selected){

function scopeIds(scope){
  var w=state.config.west, y=yellowN(), e=state.config.east, ids=[], i;
  switch(scope){
    case "zJ": for(i=1;i<=y;i++) ids.push("J-"+i); break;
    case "zV": for(i=1;i<=w;i++) ids.push("V-"+i); break;
    case "zR": for(i=1;i<=e;i++) ids.push("R-"+i); break;
    case "zB": for(i=1;i<=e;i++) ids.push("B-"+i); break;
    case "ind": for(i=1;i<=state.config.indiv;i++) ids.push("IND-"+i); break;
    case "bergerie": ids=bergerieIds(); break;
    case "bA": case "bB": case "bC": case "bD":
      var bk=scope[1]; for(i=1;i<=6;i++) ids.push("O:"+bk+"-"+i); break;
    case "orhy": ids=orhyIds(); break;
  }
  return ids;
}

function parseCaseCell(raw){
  var v=String(raw||"").toLowerCase().trim();
  if(/saut/.test(v)) return null;
  var o=v.match(/^([abcd])\s*-?\s*([1-6])$/);
  if(o) return "O:"+o[1].toUpperCase()+"-"+o[2];
  var m=v.match(/^(?:ind[a-zé]*[\s_-]*|i)(\d+)$/);
  if(m){ var k=parseInt(m[1],10); return (k>=1&&k<=state.config.indiv)? "IND-"+k : null; }
  var num=parseInt(v,10);
  return numberToId()[num]||null;
}
function importCsvText(text){
  var sep = text.indexOf(";")>-1 ? ";" : ",";
  var rows = text.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean)
    .map(function(l){ return l.split(sep).map(function(c){return c.trim().replace(/^"|"$/g,"");}); });
  if(rows.length<2) throw new Error("fichier vide");
  var header=rows[0].map(function(h){return h.toLowerCase();});
  var ramCol=-1, caseCol=-1, cdoCol=-1, raceCol=-1, naissCol=-1, i;
  for(i=0;i<header.length;i++){
    if(cdoCol<0 && /cdo/.test(header[i])) cdoCol=i;
    else if(raceCol<0 && /race/.test(header[i])) raceCol=i;
    else if(naissCol<0 && /naiss/.test(header[i])) naissCol=i;
    else if(ramCol<0 && /ident|boucle|belier|bélier|agneau|animal/.test(header[i])) ramCol=i;
    if(caseCol<0 && /case|parc|lot|emplacement/.test(header[i])) caseCol=i;
  }
  if(ramCol<0||caseCol<0) throw new Error("Colonnes non reconnues : il faut une colonne identifiant et une colonne case");
  var ok=0, skipped=0;
  rows.slice(1).forEach(function(r){
    var num=r[ramCol], id=parseCaseCell(r[caseCol]);
    if(!num||!id){ skipped++; return; }
    var cdo=(cdoCol>-1 && r[cdoCol])? String(r[cdoCol]).trim() : "";
    if(cdo && /^\d{1,4}$/.test(cdo)) cdo=("0000"+cdo).slice(-4);
    var race=(raceCol>-1 && r[raceCol])? String(r[raceCol]).trim() : "";
    var naiss=(naissCol>-1 && r[naissCol])? toISO(r[naissCol]) : "";
    if(moveAnimal(num, id, {cdo:cdo, race:race, naissance:naiss})) ok++;
  });
  save();
  ui.ioMessage="Import termin\u00E9 : "+ok+" animal(aux) plac\u00E9(s)"+(skipped? ", "+skipped+" ligne(s) ignor\u00E9e(s)":"")+".";
}

// ————— recherche —————
function matches(hay, words){
  var h=hay.toLowerCase();
  for(var i=0;i<words.length;i++){
    var w=words[i];
    if(w.length===1){
      var re=new RegExp("(^|[^a-z0-9])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|[^a-z0-9])");
      if(!re.test(h)) return false;
    } else if(h.indexOf(w)===-1) return false;
  }
  return true;
}
function searchAll(){
  var q=(ui.search||"").toLowerCase().trim();
  if(!q) return null;
  var words=q.split(/\s+/).filter(Boolean);
  var rams=[], events=[];
  allIds().forEach(function(id){
    var where=caseToken(id)+" "+kindOf(id)+" "+zoneOf(id).label+" "+penTitle(id)+" "+(bldgOf(id)==="orhy"?"orhy agneau":"bergerie b\u00E9lier belier");
    var pen=state.pens[id];
    if(pen&&pen.rams){
      pen.rams.forEach(function(r){
        if(matches(ramNum(r)+" "+ramCdo(r)+" "+ramRace(r)+" "+ramNaiss(r)+" "+where, words)) rams.push({ram:r,id:id});
      });
    }
    (state.events[id]||[]).forEach(function(ev){
      var t=EVENT_TYPES.filter(function(x){return x.id===ev.type;})[0];
      var hay=(ev.text||"")+" "+((t&&t.label)||ev.type)+" "+(ev.ram||"")+" "+(ev.date||"")+" "+fmtDate(ev.date)+" "+(ev.echeance||"")+" "+where;
      if(matches(hay,words)) events.push({ev:ev,id:id,typeLabel:(t&&t.label)||ev.type,typeColor:(t&&t.color)||"#6B6B60"});
    });
  });
  events.sort(function(a,b){ return a.ev.date<b.ev.date?1:-1; });
  return { rams:rams, events:events };
}

// ————— rendu : couleurs —————
function fillFromColor(color, count){
  if(count===0) return "#fff";
  var t=0.35+0.65*Math.min(1,count/maxCount());
  var hex=color.replace("#","");
  var r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  function mix(c){ return Math.round(255+(c-255)*t); }
  return "rgb("+mix(r)+","+mix(g)+","+mix(b)+")";
}
function penFillColor(id){ return fillFromColor(zoneOf(id).color, penCount(id)); }
function textOn(count){ return (count/maxCount()>0.55)? "#fff" : "#1B201B"; }
function penTextColor(id){ return textOn(penCount(id)); }

  }

  var topY=M, aisleY=M+PEN_H, botY=aisleY+AISLE_H, i;

  s+='<rect x="'+(M-6)+'" y="'+(topY-6)+'" width="'+(svgW-2*M+12)+'" height="'+(PEN_H*2+AISLE_H+12)+'" fill="none" stroke="#1B201B" stroke-width="2.5"/>';

  s+='<text x="'+(M+westW/2)+'" y="'+(aisleY+AISLE_H/2+4)+'" text-anchor="middle" font-size="11" fill="#8A8878" letter-spacing="4" style="pointer-events:none">ALL&#201;E CENTRALE</text>';
  s+='<text x="'+(M+westW+BLOCK_W+eastW/2)+'" y="'+(aisleY+AISLE_H/2+4)+'" text-anchor="middle" font-size="11" fill="#8A8878" letter-spacing="4" style="pointer-events:none">ALL&#201;E CENTRALE</text>';
  for(i=1;i<=y;i++) s+=penSvg("J-"+i, M+(i-1)*PEN_W, topY, PEN_W, PEN_H, true, false);
  var ix=M+y*PEN_W;
  s+='<g onclick="toggleInd()" style="cursor:pointer">';

  s+='</svg>';

// ————— plan Orhy —————
function orhyPlanSvg(){
  var CW=78, CH=88, M=24, GX=56, GY=44;
  var BW=3*CW, BH=2*CH;
  var svgW=M+BW+GX+BW+M, svgH=M+16+BH+GY+BH+M;
  var s='<svg width="'+svgW+'" height="'+svgH+'" viewBox="0 0 '+svgW+' '+svgH+'" style="min-width:'+svgW+'px">';
  var positions={ C:[M, M+16], D:[M+BW+GX, M+16], A:[M, M+16+BH+GY], B:[M+BW+GX, M+16+BH+GY] };
  s+='<text x="'+(svgW/2)+'" y="'+(M+16+BH+GY/2+4)+'" text-anchor="middle" font-size="11" fill="#8A8878" letter-spacing="4" style="pointer-events:none">ALL&#201;E</text>';
  ["C","D","A","B"].forEach(function(bk){
    var blk=BLOCKS[bk], bx=positions[bk][0], by=positions[bk][1];
    s+='<rect x="'+bx+'" y="'+(by-13)+'" width="10" height="10" rx="2" fill="'+blk.color+'"/>';
    s+='<text x="'+(bx+15)+'" y="'+(by-4)+'" font-size="11" font-weight="700" fill="'+blk.color+'">'+blk.label.toUpperCase()+'</text>';
    // rangée haute : cases 4-6 ("T") · rangée basse : cases 1-3 ("B"), le 1 face au 4
    [["T",3,0],["B",0,CH]].forEach(function(rowDef){
      var row=rowDef[0], base=rowDef[1], oy=rowDef[2];
      var col=1;
      while(col<=3){
        var g=groupOf("O:"+bk+"-"+(base+col));
        var len=g.length;
        var leader=g[0];
        var x=bx+(col-1)*CW, y=by+oy, wdt=len*CW;
        var cnt=groupCount(g), sel=(ui.selected===leader);
        var hasEv=false; g.forEach(function(id){ if((state.events[id]||[]).length>0) hasEv=true; });
        var due=groupHasDue(g);
        s+='<g onclick="selectPen(\''+leader+'\')" style="cursor:pointer">';
        s+='<rect x="'+(x+1.5)+'" y="'+(y+1.5)+'" width="'+(wdt-3)+'" height="'+(CH-3)+'" rx="2" fill="'+fillFromColor(blk.color,cnt)+'" stroke="'+(sel?"#1B201B":blk.color)+'" stroke-width="'+(sel?3.5:1.8)+'"/>';
        s+='<text x="'+(x+wdt/2)+'" y="'+(y+24)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+textOn(cnt)+'" style="font-family:ui-monospace,monospace;pointer-events:none">'+groupTokenLabel(g)+'</text>';
        s+='<text x="'+(x+wdt/2)+'" y="'+(y+CH-16)+'" text-anchor="middle" font-size="15" font-weight="800" fill="'+(cnt>0? textOn(cnt) : "#C9C7BD")+'" style="pointer-events:none">'+(cnt>0? cnt : "&#183;")+'</text>';
        if(hasEv) s+='<circle cx="'+(x+wdt-9)+'" cy="'+(y+10)+'" r="3.5" fill="#1B201B"/>';
        if(due) s+='<circle cx="'+(x+9)+'" cy="'+(y+10)+'" r="3.5" fill="#E07B00"/>';
        s+='</g>';
        col+=len;
      }
      for(var gap=1;gap<=2;gap++){
        var key=partKey(bk,row,gap);
        var px=bx+gap*CW, py=by+oy+CH/2;
        var open=partOpen(bk,row,gap);
        s+='<g onclick="togglePartition(\''+key+'\')" style="cursor:pointer">';
        s+='<circle cx="'+px+'" cy="'+py+'" r="11" fill="#fff" stroke="'+blk.color+'" stroke-width="1.5"/>';
        s+='<text x="'+px+'" y="'+(py+4)+'" text-anchor="middle" font-size="11" font-weight="800" fill="'+blk.color+'" style="pointer-events:none">'+(open? "&#8596;" : "&#9612;&#9616;")+'</text>';
        s+='</g>';
      }
    });
    s+='<rect x="'+bx+'" y="'+by+'" width="'+BW+'" height="'+BH+'" fill="none" stroke="#1B201B" stroke-width="2.5"/>';
  });
  s+='</svg>';
  return s;
}

function findEventInGroup(evId, members){
  for(var i=0;i<members.length;i++){
    var list=state.events[members[i]]||[];
    for(var j=0;j<list.length;j++) if(list[j].id===evId) return list[j];
  }
  return null;
}

    });
  });
  var raceKeys=Object.keys(races).sort(function(a,b){return races[b]-races[a];});
  if(raceKeys.length){
    h+='<h3 style="margin-top:16px">Par race</h3><table>';
    raceKeys.forEach(function(k){ h+='<tr><td>'+esc(k)+'</td><td class="num">'+races[k]+'</td></tr>'; });
    h+='</table>';
  }
  // rappels
  var rem=allReminders();
  h+='<h3 style="margin-top:16px">Rappels de soins ('+rem.length+')</h3>';
  if(rem.length===0){
    h+='<p class="sub">Aucun rappel programm\u00E9. Ajoutez une date &#171;&#8239;Rappel le&#8239;&#187; sur un \u00E9v\u00E9nement pour qu\'il apparaisse ici et sur le plan (pastille orange).</p>';
  } else {
    h+='<ul class="hist">';
    rem.slice(0,20).forEach(function(x){
      var t=EVENT_TYPES.filter(function(e){return e.id===x.ev.type;})[0];
      h+='<li style="cursor:pointer" onclick="selectPen(\''+x.id+'\')"><span class="due '+x.cls+'">'+fmtDate(x.ev.echeance)+'</span><div style="flex:1;min-width:0"><div style="font-size:14px">'+esc(x.ev.text)+(x.ev.ram? ' <span class="mono">['+esc(x.ev.ram)+']</span>':'')+'</div><div class="when">'+esc(safeCaseName(x.id))+' &#183; '+((t&&t.label)||x.ev.type)+' du '+fmtDate(x.ev.date)+'</div></div><span class="sr-open">Ouvrir &#8250;</span></li>';
    });
    h+='</ul>';
    if(rem.length>20) h+='<p class="sub">&#8230; et '+(rem.length-20)+' autres.</p>';
  }
  // capacité
  var caps=[];
  allIds().forEach(function(id){
    var c=capacityOf(id);
    if(c>0 && penCount(id)>c) caps.push({id:id, n:penCount(id), cap:c});
  });
  if(state.config.capCol||state.config.capInd||state.config.capOrhy){
    h+='<h3 style="margin-top:16px">Cases au-dessus de la capacit\u00E9 ('+caps.length+')</h3>';
    if(caps.length===0) h+='<p class="sub">Tout est dans les limites d\u00E9finies.</p>';
    else {
      h+='<ul class="hist">';
      caps.forEach(function(x){ h+='<li style="cursor:pointer" onclick="selectPen(\''+x.id+'\')"><span class="due late">'+x.n+' / '+x.cap+'</span><div style="flex:1"><div style="font-size:14px">'+esc(safeCaseName(x.id))+'</div></div><span class="sr-open">Ouvrir &#8250;</span></li>'; });
      h+='</ul>';
    }
  } else {
    h+='<p class="sub" style="margin-top:12px">Astuce : d\u00E9finissez des capacit\u00E9s maximales par type de case dans &#171;&#8239;Configurer&#8239;&#187; (onglet Bergerie) pour voir ici les cases surcharg\u00E9es.</p>';
  }
  // derniers déplacements
  h+='<h3 style="margin-top:16px">Derniers d\u00E9placements</h3>';
  if(state.moves.length===0) h+='<p class="sub">Aucun d\u00E9placement enregistr\u00E9.</p>';
  else {
    h+='<ul class="hist">';
    state.moves.slice(-10).reverse().forEach(function(mv){
      h+='<li><span class="tag" style="background:#2C5F8A">'+fmtDate(mv.date)+'</span><div style="flex:1;min-width:0"><div style="font-size:14px"><span class="mono">'+esc(mv.ram)+'</span> &#8212; '+esc(moveLabel(mv))+'</div></div></li>';
    });
    h+='</ul>';
  }
  h+='</div>';
  return h;
}

// ————— rendu principal —————
function render(){
  var app=document.getElementById("app");
  var b=ui.building;
  var h='';
  var titles={bergerie:"Bergerie &#8212; plan interactif", orhy:"Orhy &#8212; b&#226;timent des agneaux", synthese:"Synth&#232;se des deux b&#226;timents"};
  h+='<header><p class="eyebrow">CDEO</p><h1>'+titles[b]+'</h1>';
  var word=(b==="synthese")? "animaux" : animalWord(b)+"(s)";
  h+='<div class="headrow"><div class="total">'+totalSheep(b)+'<small>'+word+' &#183; '+occupiedCount(b)+' case(s) occup&#233;e(s)</small></div>';
  h+='<button class="btn" onclick="exportInventory()">Export inventaire</button>';
  h+='<button class="btn" onclick="exportHistory()">Export historique</button>';
  h+='<button class="btn solid" onclick="triggerImport()">Importer CSV</button>';
  h+='<button class="btn" onclick="exportBackup()">Sauvegarde</button>';
  h+='<button class="btn" onclick="triggerRestore()">Restaurer</button>';
  if(b==="bergerie") h+='<button class="btn" onclick="toggleConfig()">Configurer</button>';
  if(b!=="synthese") h+='<button class="btn" onclick="toggleGroupEvent()">\u00C9v\u00E9nement group\u00E9</button>';
  h+='</div>';
  if(ui.ioMessage) h+='<p class="msg">'+esc(ui.ioMessage)+'</p>';
  if(!ui.storageOk) h+='<p class="warn">Sauvegarde locale indisponible dans cet aper&#231;u &#8212; t&#233;l&#233;chargez le fichier et ouvrez-le dans le navigateur du t&#233;l&#233;phone pour que les donn&#233;es soient conserv&#233;es.</p>';
  h+='<div class="tabs">';
  h+='<button class="tab'+(b==="bergerie"?" on":"")+'" onclick="setBuilding(\'bergerie\')">&#128016; Bergerie</button>';
  h+='<button class="tab'+(b==="orhy"?" on":"")+'" onclick="setBuilding(\'orhy\')">&#128017; Orhy</button>';
  h+='<button class="tab'+(b==="synthese"?" on":"")+'" onclick="setBuilding(\'synthese\')">&#128202; Synth&#232;se</button>';
  h+='</div></header>';
  // barre de scan globale
  h+='<div class="scanbar"><span class="lbl">&#128246; Scan boucle</span><input type="text" id="scaninput" placeholder="Scannez une boucle n\'importe quand&#8230;" onkeydown="if(event.key===\'Enter\'){globalScan();}"><button class="act" style="background:var(--Jdark)" onclick="globalScan()">OK</button></div>';
  if(b==="bergerie" && ui.showConfig){
    h+='<div class="panel cfg" style="margin-top:12px"><p style="font-weight:700;font-size:14px;margin:0 0 6px">Configuration</p>';
    h+='<p class="sub" style="margin-bottom:10px">Num&#233;rotation 1&#8211;'+lastNumber()+' recalcul\u00E9e automatiquement. Capacit\u00E9s : 0 = d\u00E9sactiv\u00E9 ; au-del\u00E0 de la capacit\u00E9, la case est signal\u00E9e dans la Synth\u00E8se.</p>';
    h+='<label>Cases verte <input type="number" id="cfgw" min="4" max="30" value="'+state.config.west+'"></label>';
    h+='<label>Cases rouge/bleue <input type="number" id="cfge" min="1" max="30" value="'+state.config.east+'"></label>';
    h+='<label>Individuelles <input type="number" id="cfgi" min="1" max="40" value="'+state.config.indiv+'"></label><br>';
    h+='<label>Capacit\u00E9 collective <input type="number" id="cfgcc" min="0" value="'+state.config.capCol+'"></label>';
    h+='<label>Capacit\u00E9 individuelle <input type="number" id="cfgci" min="0" value="'+state.config.capInd+'"></label>';
    h+='<label>Capacit\u00E9 case Orhy <input type="number" id="cfgco" min="0" value="'+state.config.capOrhy+'"></label> ';
    h+='<button class="act" style="background:var(--ink)" onclick="applyConfig()">Appliquer</button></div>';
  }
  if(b!=="synthese" && ui.showGroupEvent) h+='<div style="margin-top:12px">'+groupEventHtml()+'</div>';
  if(b==="synthese"){
    h+='<div style="margin-top:14px">'+dashboardHtml()+'</div>';
  } else {
    h+='<div class="planwrap">'+(b==="orhy"? orhyPlanSvg() : planSvg())+'</div>';
    if(b==="bergerie" && ui.indOpen){
      h+='<div class="panel" style="border:1.5px solid var(--J);box-shadow:none"><p class="boxtitle" style="color:var(--Jdark)">Cases individuelles I1 &#224; I'+state.config.indiv+' (hors num&#233;rotation) &#183; rang&#233;e jaune, contre les cases de saut</p><div class="grid">';
      for(var i=1;i<=state.config.indiv;i++){
        var iid="IND-"+i, n=penCount(iid), sel=(ui.selected===iid);
        h+='<button class="cellbtn'+(sel?" sel":"")+'" style="background:'+(n>0?"var(--Jsoft)":"#fff")+'" onclick="selectPen(\''+iid+'\')"><span class="id">I'+i+'</span><span class="n" style="color:'+(n>0?"var(--Jdark)":"var(--line)")+'">'+(n>0?n:"&#183;")+'</span></button>';
      }
      h+='</div></div>';
    }
    if(b==="bergerie"){
      h+='<div class="legend">';
      [ZONES.J,ZONES.V,ZONES.R,ZONES.B].forEach(function(z){ h+='<span><span class="sw" style="background:'+z.color+'"></span>'+z.label+'</span>'; });
      h+='<span><span class="dot"></span>historique</span><span><span class="adot"></span>rappel proche/d&#233;pass&#233;</span>';
      h+='<span>Num&#233;rotation horaire&#8239;: case 1 en verte contre le centre, case '+lastNumber()+' en bleue contre le centre.</span></div>';
    } else {
      h+='<div class="legend">';
      h+='<span>Blocs C et D en haut, A et B en bas &#183; cases 1&#8211;3 en bas (1 &#224; gauche) face aux cases 4&#8211;6.</span>';
      h+='<span><span class="dot"></span>historique</span><span><span class="adot"></span>rappel proche/d&#233;pass&#233;</span>';
      h+='<span>&#9612;&#9616; cloison ferm&#233;e &#183; &#8596; cloison ouverte (cases fusionn&#233;es).</span></div>';
    }
  }
  h+='<div class="panel" style="box-shadow:none;border:1px solid var(--line)">';
  h+='<p class="boxtitle" style="color:var(--ink)">Recherche (les deux b&#226;timents)</p>';
  h+='<div class="row"><input type="text" id="searchinput" placeholder="Animal, case, zone, bloc, &#233;v&#233;nement, date&#8230;" value="'+esc(ui.search)+'" oninput="doSearch(this.value)">';
  h+='<button class="act" style="background:var(--muted)" onclick="clearSearch()">Effacer</button></div>';
  h+='<div id="searchresults">'+searchResultsHtml()+'</div></div>';
  if(b!=="synthese") h+= ui.ramView? ramFicheHtml() : ficheHtml();
  else if(ui.ramView) h+=ramFicheHtml();
  app.innerHTML=h;
}

document.getElementById("csvfile").addEventListener("change", function(e){
  var f=e.target.files && e.target.files[0];
  if(!f) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{ importCsvText(String(reader.result||"")); }
    catch(err){ ui.ioMessage="Import impossible : "+(err.message||"fichier illisible")+"."; }
    render();
  };
  reader.readAsText(f,"utf-8");
  e.target.value="";
});
document.getElementById("bakfile").addEventListener("change", function(e){
  var f=e.target.files && e.target.files[0];
  if(!f) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var d=JSON.parse(String(reader.result||""));
      var payload=d.state||d;
      if(!payload.pens && !payload.config) throw new Error("ce fichier n'est pas une sauvegarde de l'application");
      if(typeof confirm==="function" && !confirm("Restaurer cette sauvegarde ? Les donn\u00E9es actuelles de ce t\u00E9l\u00E9phone seront remplac\u00E9es.")){ return; }
      state = { config:{west:18,east:17,indiv:20,capCol:0,capInd:0,capOrhy:0}, pens:{}, events:{}, moves:[], partitions:{} };
      applyData(payload);
      save();
      ui.selected=null; ui.ramView=null;
      ui.ioMessage="Sauvegarde restaur\u00E9e"+(d.savedAt? " (du "+fmtDate(String(d.savedAt).slice(0,10))+")":"")+".";
    }catch(err){ ui.ioMessage="Restauration impossible : "+(err.message||"fichier illisible")+"."; }
    render();
  };
  reader.readAsText(f,"utf-8");
  e.target.value="";
});

load();
save();
render();
</script>
</body>
</html>
